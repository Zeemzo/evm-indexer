{{- if .Values.secrets }}
# Optional convenience Secret created from inline .Values.secrets.
# For real clusters prefer an externally-managed Secret (e.g. External Secrets
# Operator / SealedSecrets) and leave .Values.secrets empty, pointing
# .Values.secretEnv.secretName at your own Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretEnv.secretName }}
  labels:
    {{- include "evm-indexer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
